<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>简历可视化编辑工作台</title>
<link rel="stylesheet" href="editor.css?v=10">
</head>
<body>
<!-- 悬浮侧边导航：上区=身份与内容（当前文档/文档列表/新建/AI），下区=交付与元动作（导出/保存/引导/钉住/状态行）。
     收起 64px 图标栏，悬停/键盘聚焦零延迟展开（收起留 .15s 防抖宽限） -->
<nav id="rail" aria-label="主导航">
  <div class="rail-head" title="当前文档">
    <span class="rail-docicon" id="rail-docicon"></span>
    <span class="rail-dot" id="rail-dot" title=""></span>
    <span class="rail-doctext"><b id="rail-docname">—</b><i id="rail-kind">加载中…</i></span>
  </div>
  <div class="rail-line"></div>
  <div class="rail-title">文档</div>
  <div id="rail-docs"></div>
  <button class="rail-item" data-nav="newjob" title="复制主简历生成岗位副本">
    <span class="ric"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></svg></span>
    <span class="con">新建岗位副本</span>
  </button>
  <div class="rail-line"></div>
  <div class="rail-title">AI</div>
  <button class="rail-item" data-nav="ai" title="AI 助手（Ctrl+J）">
    <span class="ric"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="9" width="14" height="10" rx="3"/><path d="M12 9V5M9.5 5h5"/><circle cx="9.5" cy="13.5" r=".9" fill="currentColor" stroke="none"/><circle cx="14.5" cy="13.5" r=".9" fill="currentColor" stroke="none"/></svg></span>
    <span class="con">AI 助手</span>
  </button>
  <div class="rail-spacer"></div>
  <button class="rail-item" data-nav="export" title="导出 A4 PDF（Ctrl+E）——自动先保存">
    <span class="ric"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4v11m0 0l-4-4m4 4l4-4"/><path d="M5 20h14"/></svg></span>
    <span class="con">导出 PDF</span>
  </button>
  <button class="rail-item" data-nav="save" title="立即保存（Ctrl+S；平时自动保存）">
    <span class="ric"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M5 3h11l3 3v15H5z"/><path d="M8 3v5h7V3M8 21v-6h8v6"/></svg></span>
    <span class="con">保存</span>
  </button>
  <div class="rail-line"></div>
  <button class="rail-item" data-nav="help" title="新手引导 / 快捷键（?）">
    <span class="ric"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M9.6 9.2a2.5 2.5 0 1 1 3.6 2.3c-.8.4-1.2.9-1.2 1.8"/><path d="M12 16.6h.01"/></svg></span>
    <span class="con">引导与快捷键</span>
  </button>
  <button class="rail-item" data-nav="pin" title="钉住导航（保持展开）" aria-pressed="false">
    <span class="ric"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 16v6"/><path d="M8.5 3h7l-1 7 3.5 3.5H6L9.5 10z"/></svg></span>
    <span class="con">钉住导航</span>
  </button>
  <div class="rail-foot">
    <span class="con" id="save-state" title="点击立即保存">就绪</span>
  </div>
</nav>

<main>
  <section id="left">
    <div id="job-banner" class="banner hidden">岗位副本模式：这里的改动只影响此副本，主简历不受影响。行尾 👁 一键切换显示/隐藏（⋯ 菜单里也有），已隐藏的行有琥珀色眼睛可恢复；隐藏的条目不进预览与 PDF。</div>
    <div id="cards"></div>
    <div id="empty-hint" class="hidden">尚未加载文档</div>
  </section>
  <div id="splitter" title="拖动调整左右占比；双击复位"></div>
  <section id="right">
    <div class="pv-toolbar">
      <span class="pv-label">实时预览（A4）</span>
      <span id="doc-chip" class="chip" title="当前文档">—</span>
      <span class="seg" id="density-seg" role="group" aria-label="排版密度">
        <button type="button" data-density="宽松" aria-pressed="false">宽松</button><button type="button" data-density="标准" class="on" aria-pressed="true">标准</button><button type="button" data-density="紧凑" aria-pressed="false">紧凑</button>
      </span>
      <span id="gauge-pages" class="chip" title="按 A4 页高估算的页数">— 页</span>
      <span id="gauge-fill" class="chip" title="内容高度占版心比例；超过 100% 会溢出一页">—</span>
      <span id="chars" class="chip" title="未隐藏成果的总字数">成果字数 —</span>
      <span id="hidden-chip" class="chip mid hidden" title="本次取舍已拿掉的内容块数；行尾琥珀眼睛或 ⋯ 菜单可恢复">已隐藏 0</span>
      <span class="spacer"></span>
      <span class="pv-hint">点预览内容可跳到左侧卡片</span>
      <select id="zoom-select" title="预览缩放">
        <option value="0.5">50%</option><option value="0.65">65%</option>
        <option value="0.8" selected>80%</option><option value="1">100%</option>
      </select>
    </div>
    <div id="preview-scroll"><div id="zoom-box"><iframe id="preview" src="/app/preview.html?v=6"></iframe></div></div>
  </section>
</main>

<aside id="ai-panel" class="ai-closed">
  <div class="ai-head">
    <strong><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" class="ai-ic"><rect x="5" y="9" width="14" height="10" rx="3"/><path d="M12 9V5M9.5 5h5"/><circle cx="9.5" cy="13.5" r=".9" fill="currentColor" stroke="none"/><circle cx="14.5" cy="13.5" r=".9" fill="currentColor" stroke="none"/></svg> AI 助手</strong>
    <button id="ai-close" class="btn small">✕</button>
  </div>
  <div id="ai-steps">
    <div class="ai-step" data-step="1">粘贴岗位 JD 原文</div>
    <div class="ai-step" data-step="2">点「发起 AI 优化」——提示词自动复制</div>
    <div class="ai-step" data-step="3">到你的 AI agent 粘贴运行，建议写好后自动出现在下面</div>
  </div>
  <textarea id="ai-jd" placeholder="粘贴岗位 JD 原文…"></textarea>
  <div class="ai-row">
    <button id="ai-request" class="btn primary">发起 AI 优化</button>
    <button id="ai-copy" class="btn" disabled title="发起后提示词自动复制；也可在此手动复制">复制提示词</button>
    <button id="ai-refresh" class="btn small" title="手动重新读取建议文件">↻</button>
  </div>
  <div id="ai-toolbar" class="hidden">
    <button id="ai-apply-all" class="btn small">✓ 全部应用</button>
    <span id="ai-count"></span>
  </div>
  <div id="ai-cards"></div>
</aside>

<div id="toast"></div>
<input type="file" id="photo-file" accept="image/*" class="hidden">
<script src="vendor/Sortable.min.js?v=6"></script>
<script src="editor.js?v=11"></script>
</body>
</html>
